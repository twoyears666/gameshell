name: Probe Azahar iOS Libretro Build

# 探路工作流：只回答一个问题 —— 「iOS 上到底能不能编出 Azahar 的 libretro 核心」。
#
# 为什么单开一条、而不是并进 build.yml：
#   Azahar 递归子模块近 20 个（boost / dynarmic / libressl / …），一次 configure + 编译很重，
#   不该跟着每次 push 都烧。这里 push 只在 azahar-probe 分支、且只改到本文件时触发；
#   workflow_dispatch 供日后手动重跑。
#
# ⚠️ 本工作流**不接入主工程**：不改 project.yml、不动 Scripts/build_cores.sh、不碰
#    GSBuiltCores.h。它只把 Azahar 拉到 runner 上按 iOS 交叉编译参数试编一遍，
#    把真实日志传上来。日志是决定性证据，编不出来之前绝不假装接入。

on:
  workflow_dispatch:
  push:
    branches: ['azahar-probe']
    paths:
      - '.github/workflows/probe-azahar-ios.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    name: 探路编译
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: 打印工具链版本（Xcode / CMake / Git）
        run: |
          xcodebuild -version
          cmake --version || brew install cmake
          git --version

      - name: 克隆 Azahar 及其全部子模块
        run: |
          set -euo pipefail
          git clone --recurse-submodules --jobs 8 \
            https://github.com/azahar-emu/azahar.git azahar
          echo "---- Azahar 顶层源码树（确认关键目录在位）----"
          ls -la azahar | head -40
          echo "---- libretro 前端源码目录 ----"
          ls -la azahar/src/citra_libretro 2>/dev/null || echo "(没有 src/citra_libretro)"
          echo "---- 三种 CPU 后端目录（dynarmic=JIT / dyncom=解释器 / fastinterp=新解释器）----"
          ls -la azahar/src/core/arm 2>/dev/null || echo "(没有 src/core/arm)"
          echo "---- 自带的 MoltenVK xcframework ----"
          ls -la azahar/static/MoltenVK.xcframework 2>/dev/null || echo "(没有自带 MoltenVK.xcframework)"

      - name: 打印 Azahar 的关键构建开关
        run: |
          set -uo pipefail
          echo "---- 与 libretro / 图形后端 / Apple 有关的开关行 ----"
          grep -nE 'ENABLE_LIBRETRO|ENABLE_VULKAN|ENABLE_OPENGL|MoltenVK|MOLTENVK|IOS|APPLE|CMAKE_OSX_DEPLOYMENT_TARGET' \
            azahar/CMakeLists.txt | head -80
          echo "---- src/CMakeLists.txt 里的前端目标 ----"
          grep -nE 'libretro|add_library|add_executable|add_subdirectory' azahar/src/CMakeLists.txt | head -60 || true
          echo "---- libretro 前端 CMake（目标名 / 产物形态）----"
          grep -nE 'add_library|OUTPUT_NAME|SHARED|STATIC|IOS|PLATFORM_LIBRARIES|exported_symbols' \
            azahar/src/citra_libretro/CMakeLists.txt | head -60 || true

      - name: 消除 Vulkan-Hpp 的 std::format 依赖（为 iOS 16.0 铺路）
        run: |
          set -uo pipefail
          # 根因（第三/四轮探路挖出来的）：
          #   externals/vulkan-headers/include/vulkan/vulkan_to_string.hpp 里的 toHexString
          #   是个普通 inline 函数，所以每个包含该头的 TU 都会实例化 std::format("{:x}", value)。
          #   libc++ 的 std::format 内部走 std::vformat（运行期格式串），必须为「所有内建类型」
          #   实例化 formatter —— 包括浮点 —— 而浮点 to_chars 被 libc++ 标成
          #   「introduced in iOS 16.3」。于是部署目标 <16.3 时直接硬报错：
          #     'to_chars' is unavailable: introduced in iOS 16.3
          #   注意：to_chars（浮点）在 libc++ 里是 _LIBCPP_EXPORTED_FROM_ABI（外置符号），
          #   所以「用 _LIBCPP_DISABLE_AVAILABILITY 让它编过」只是把编译错误变成运行期隐患
          #   （iOS 16.0 上系统 libc++ 没这个符号）——必须从源头不实例化它，不能靠压注解。
          # 做法：该文件里 std::format 只此一处（已逐行核对）。把它的分支改成 sstream 实现，
          #   输出等价（十六进制小写）。同时保证 <sstream> 一定被 include（原本只在
          #   !__cpp_lib_format 时才 include，而 Apple libc++ 是定义了 __cpp_lib_format 的）。
          F="azahar/externals/vulkan-headers/include/vulkan/vulkan_to_string.hpp"
          echo "---- 补丁前：__cpp_lib_format / std::format / sstream 的出现位置 ----"
          grep -nE '__cpp_lib_format|std::format|include <sstream>' "$F" || true
          python3 - "$F" <<'PY'
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          text = path.read_text()

          old = '#if __cpp_lib_format\n    return std::format( "{:x}", value );\n'
          new = '#if 0  // Gameshell 补丁：不走 std::format（libc++ 会拉起浮点 to_chars，要求 iOS 16.3+）\n    return std::format( "{:x}", value );\n'
          assert old in text, "toHexString 的 std::format 段没找到（Vulkan-Headers 版本可能变了）"
          text = text.replace(old, new, 1)

          anchor = '#    include <format>  // std::format\n'
          assert anchor in text, "找不到 <format> 的 include 行"
          text = text.replace(
              anchor,
              anchor + '#    include <sstream>  // Gameshell 补丁：给 toHexString 的 sstream 分支用\n',
              1,
          )

          path.write_text(text)
          print("已打补丁：", path)
          PY
          echo "---- 补丁后：应看到被注释掉的分支 + 新增的 <sstream> include ----"
          grep -nE '__cpp_lib_format|std::format|include <sstream>|Gameshell 补丁' "$F" || true

      - name: 用 iOS 交叉编译参数配置 Azahar（libretro 核心）
        run: |
          set -uo pipefail
          # 交叉编译要点（与 Scripts/build_cores.sh 同一套）：
          #   CMAKE_SYSTEM_NAME=iOS + OSX_SYSROOT/ARCHITECTURES/DEPLOYMENT_TARGET
          #   各语言编译器显式指到 SDK 里的 clang（Azahar 会 enable_language(OBJC OBJCXX)，
          #     所以 OBJC/OBJCXX 也要指，否则 cmake 挑宿主编译器、产物是 macOS 架构）
          #   刻意不设 CMAKE_TRY_COMPILE_TARGET_TYPE（保持默认 EXECUTABLE，检测会真去链接）。
          #     前两轮探路的真根因就在这：设成 STATIC_LIBRARY 时 try_compile 只编译不链接，
          #     于是 libressl 的 check_function_exists 一律「假阳性」（任何调用都能编过），
          #     它便不启用自带的 compat 垫片（crypto/compat/*.c + include/compat/*.h），
          #     cryptlib.c / mem_clr.c 就去调 Darwin/iOS 上根本不存在（也无声明）的
          #     vsyslog_r、explicit_bzero。默认 EXECUTABLE 下检测是真实的（链接失败即 not found），
          #     与 macOS 上能正常编过的路径一致。实测佐证：macOS 上 explicit_bzero 既无声明
          #     也链接不到，所以 macOS 走的是 libressl 自带垫片，这正是它没报错的原因。
          #   另加两条兜底（即使检测仍不可靠，也强制走垫片）：
          #     -DHAVE_SYSLOG_R=0（iOS 无 syslog_r）、-DHAVE_EXPLICIT_BZERO=0（Darwin 全系无声明）
          #   ENABLE_LIBRETRO=ON —— 会自动强制关掉 SDL2/Qt/WebService/Scripting/GDBStub/
          #     OpenAL/Cubeb/libusb/FFmpeg（见根 CMakeLists 的 libretro 冲突处理）
          #   ENABLE_LTO=OFF —— 探路阶段关掉，快且少踩 LTO 的坑
          #   CMAKE_OSX_DEPLOYMENT_TARGET=16.0 —— 与宿主 App 最低版本对齐（让 3DS 也支持 16.0）。
          #     第三轮探路曾在 16.0 挂到 84%，唯一报错是
          #     「'to_chars' is unavailable: introduced in iOS 16.3」。
          #     第四轮抬到 16.3 编通了，但那会把核心的编译下限抬到 16.3，不符合本轮目标。
          #     本轮把真正的根因消除掉（见上一步「给 Vulkan-Hpp 打补丁」），部署目标回到 16.0。
          #     注：Azahar 根 CMakeLists 里那段「iOS 最低 14.0」被 `if (APPLE AND NOT ENABLE_LIBRETRO)`
          #     包着，libretro 模式下根本不执行，所以这里传的值就是生效值。
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          CC=$(xcrun --sdk iphoneos --find clang)
          CXX=$(xcrun --sdk iphoneos --find clang++)
          echo "SDK=${SDK}"
          cmake -S azahar -B build \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 \
            -DCMAKE_C_COMPILER="$CC" \
            -DCMAKE_CXX_COMPILER="$CXX" \
            -DCMAKE_OBJC_COMPILER="$CC" \
            -DCMAKE_OBJCXX_COMPILER="$CXX" \
            -DCMAKE_ASM_COMPILER="$CC" \
            -DCMAKE_C_COMPILER_WORKS=1 \
            -DCMAKE_CXX_COMPILER_WORKS=1 \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_LIBRETRO=ON \
            -DENABLE_TESTS=OFF \
            -DENABLE_LTO=OFF \
            -DHAVE_SYSLOG_R=0 \
            -DHAVE_EXPLICIT_BZERO=0 \
            -DCITRA_WARNINGS_AS_ERRORS=OFF \
            2>&1 | tee probe-configure.log
          echo "---- 配置结果里的关键 STATUS 行 ----"
          grep -E 'MoltenVK|Vulkan|OpenGL|LibRetro|libretro|Configuring done|Generating done' \
            probe-configure.log | tail -40 || true
          echo "---- 生效的部署目标 / 架构 / 平台（期望 16.3 / arm64 / iOS）----"
          grep -nE 'CMAKE_OSX_DEPLOYMENT_TARGET|CMAKE_OSX_ARCHITECTURES|CMAKE_SYSTEM_NAME' build/CMakeCache.txt 2>/dev/null || echo "(CMakeCache 里没有这几项)"
          echo "---- libressl 垫片开关（期望两个都落在 0）----"
          grep -nE 'HAVE_SYSLOG_R|HAVE_EXPLICIT_BZERO' build/CMakeCache.txt 2>/dev/null || echo "(CMakeCache 里没有这两个变量)"
          echo "---- 若这两项检测真跑过，应能看到它们的真实结论 ----"
          grep -nE 'Looking for (syslog_r|explicit_bzero)' probe-configure.log | tail -5 || echo "(没有这两条检测行 —— 检测被整段跳过，符合预期)"

      - name: 列出 Azahar 的 libretro 构建目标
        run: |
          set -uo pipefail
          echo "---- 全部可用目标里含 libretro / azahar 的 ----"
          cmake --build build --target help 2>&1 | grep -iE 'libretro|azahar' | sort -u || echo "(没有明显相关的目标)"
          echo "---- help 输出前 60 行（兜底参考）----"
          cmake --build build --target help 2>&1 | head -60 || true

      - name: 编译 Azahar libretro 核心
        run: |
          set -uo pipefail
          # 目标名先探测，探不到就退回官方的 citra_libretro（azahar_libretro 是它的别名目标）
          TARGET=$(cmake --build build --target help 2>/dev/null \
            | grep -ioE '[a-z0-9_.-]*libretro[a-z0-9_.-]*' | sort -u | head -1)
          echo "探测到的 libretro 目标：${TARGET:-（空，退回 citra_libretro）}"
          [ -n "$TARGET" ] || TARGET=citra_libretro
          echo "实际编译目标：$TARGET"
          cmake --build build --target "$TARGET" --parallel 4 2>&1 | tee probe-build.log
          echo "---- 是否编入了 libressl 的 compat 垫片（期望 syslog_r.c / explicit_bzero.c 都有）----"
          grep -nE 'compat/(syslog_r|explicit_bzero)\.c' probe-build.log | head -5 || echo "(没看到 compat 垫片 —— 未生效，需警惕)"
          echo "---- 编译日志尾部 ----"
          tail -n 80 probe-build.log || true

      - name: 打印 Azahar 编译产物形态（成功失败都打）
        if: always()
        run: |
          set -uo pipefail
          echo "---- 编译出的 libretro 相关产物 ----"
          find build -type f \( -name '*libretro*' -o -name '*.dylib' -o -name '*.a' -o -name '*.so' \) \
            -exec ls -lh {} \; 2>/dev/null | head -60 || echo "(没有找到 libretro 产物)"
          echo "---- build/bin（若存在）----"
          ls -laR build/bin 2>/dev/null | head -40 || echo "(没有 build/bin)"

      - name: 汇总编译错误（失败时）
        if: failure()
        run: |
          set -uo pipefail
          echo "==== 配置日志尾部 ===="
          tail -n 60 probe-configure.log 2>/dev/null || echo "(没有 probe-configure.log)"
          echo "==== 编译日志尾部 ===="
          tail -n 80 probe-build.log 2>/dev/null || echo "(没有 probe-build.log)"
          echo "==== 错误行去重汇总（按报错类型归类，每类取 8 条）===="
          grep -oE "error: [^\"]*" probe-build.log 2>/dev/null \
            | sed -E 's/[0-9]+/N/g' | sort | uniq -c | sort -rn | head -30 \
            || echo "(没有 error 行)"
          echo "==== 若有 availability 报错，单列出来 ===="
          grep -nE 'is unavailable|introduced in iOS' probe-build.log 2>/dev/null | head -10 \
            || echo "(没有 availability 类报错)"

      - name: 上传 Azahar 探路日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: azahar-probe-logs
          path: |
            probe-configure.log
            probe-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: 上传 Azahar libretro 核心产物（成功时）
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Azahar-iOS-Libretro
          path: |
            build/**/*libretro*
            build/**/*.dylib
          if-no-files-found: error
          retention-days: 30
