name: Build 3DS Homebrew Test ROM

# 产出小体积的 3DS homebrew 测试程序，用来给 Azahar（3DS）核心做冒烟验证：
#   · hello-world.3dsx   —— 文本控制台（printing/hello-world），最快看出「有没有画面」
#   · textured_cube.3dsx —— citro3d 贴图立方体（gpu/textured_cube），验证 GL / MoltenVK 通路与颜色
#   · simple_tri.3dsx    —— 最简三角形（gpu/simple_tri），GL 通路的兜底
#
# 注：graphics/bitmap/24bit-color 那个示例构建时依赖 ImageMagick，而 devkitpro 镜像的
#     pacman 只挂了 devkitpro 自己的仓库、装不上它，所以没收进来。
#
# 这些示例来自 devkitPro 官方仓库 3ds-examples（源码公开、产出即合法可用的自制程序），
# 不需要任何商业 ROM，也不含任何加密内容。
#
# 本机没有 devkitARM（也没有 docker），所以借 devkitpro/devkitarm 容器交叉编译。
# 触发方式刻意收窄成「workflow_dispatch + 本文件自身被改动」，避免日常 push 白跑一轮。

on:
  push:
    paths:
      - '.github/workflows/build-3ds-homebrew-test.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  homebrew:
    name: 编译 3DS 测试程序
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    timeout-minutes: 20

    steps:
      # devkitpro 镜像只在登录 shell 的 profile 里挂上工具链路径，而 Actions 用的是 sh -e，
      # 于是 arm-none-eabi-gcc 找不到。这里手动把工具链目录写进 GITHUB_PATH 兜住；
      # 同时显式导出 DEVKITPRO / DEVKITARM —— 示例的 Makefile 靠它们去找 3ds_rules。
      - name: 准备 devkitARM 环境与编译工具
        run: |
          echo "---- /opt/devkitpro 目录 ----"
          ls -la /opt/devkitpro || true
          echo "---- devkitARM/bin ----"
          ls /opt/devkitpro/devkitARM/bin 2>/dev/null | head -20 || true
          echo "---- 3ds_rules 在哪 ----"
          find /opt/devkitpro -maxdepth 2 -name '3ds_rules' 2>/dev/null || true

          for d in /opt/devkitpro/devkitARM/bin /opt/devkitpro/tools/bin; do
            [ -d "$d" ] && echo "$d" >> "$GITHUB_PATH"
          done
          echo "DEVKITPRO=/opt/devkitpro" >> "$GITHUB_ENV"
          echo "DEVKITARM=/opt/devkitpro/devkitARM" >> "$GITHUB_ENV"

          # 3ds_rules / libctru / citro3d 由 3ds-dev 提供，缺了就补
          command -v make >/dev/null || pacman -Sy --noconfirm make
          command -v git  >/dev/null || pacman -Sy --noconfirm git
          if ! find /opt/devkitpro -maxdepth 2 -name '3ds_rules' | grep -q . ; then
            pacman -Sy --noconfirm 3ds-dev || echo "3ds-dev 安装失败（后面 make 会报出来）"
          fi

      - name: 检出 3ds-examples 官方示例源码
        run: |
          git clone --depth 1 https://github.com/devkitPro/3ds-examples.git examples

      - name: 打印 devkitARM 工具链版本
        run: |
          arm-none-eabi-gcc --version
          make --version

      - name: 列出可编译的示例目录
        run: find examples -maxdepth 4 -name Makefile | sort

      - name: 编译 hello-world 示例（文本控制台）
        run: |
          set -x
          cd examples/graphics/printing/hello-world
          make -j"$(nproc)" || echo "hello-world 编译失败（记下，最后统一汇总）"

      - name: 编译 textured_cube 示例（citro3d 贴图立方体）
        run: |
          set -x
          cd examples/graphics/gpu/textured_cube
          make -j"$(nproc)" || echo "textured_cube 编译失败（记下，最后统一汇总）"

      - name: 编译 simple_tri 示例（最简三角形）
        run: |
          set -x
          cd examples/graphics/gpu/simple_tri
          make -j"$(nproc)" || echo "simple_tri 编译失败（记下，最后统一汇总）"

      - name: 汇总编译产物
        run: |
          set -u
          mkdir -p out
          find examples -maxdepth 5 \( -name '*.3dsx' -o -name '*.cia' \) -exec cp -v {} out/ \;
          echo "---- 最终产物 ----"
          ls -lh out

      - name: 收集编译诊断信息（失败时）
        if: failure()
        run: |
          echo "构建失败：打印容器环境与示例目录，便于定位"
          id
          find /opt/devkitpro -maxdepth 2 -name '3ds_rules' 2>/dev/null || true
          find examples -maxdepth 4 -name Makefile | sort || true
          ls -la out 2>/dev/null || echo "(没有 out 目录)"

      # 用 always()：就算某个示例编失败，其它成功的产物也要传上来
      - name: 上传 3DS homebrew 测试包
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 3DS-Homebrew-Test
          path: out/*
          if-no-files-found: error
          retention-days: 30
