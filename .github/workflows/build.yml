name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (iOS + macOS + IPA)
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          cmake --version || true

      - name: Install XcodeGen + CMake
        run: brew install xcodegen cmake

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show available SDKs
        run: xcodebuild -showsdks

      # ---------- iOS 真机（用于打包 IPA / tipa） ----------
      # 说明：这里产出的是「未签名 + ad-hoc 自签名」包，供 TrollStore / 侧载工具使用。
      # 正规签名的 IPA 需要 Apple 开发者证书与描述文件（当前未完成，见 REFERENCE.md）。
      - name: Build iOS (Device, unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project Gameshell.xcodeproj \
            -scheme Gameshell \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData-Device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      # 核心是交叉编译出来的：不管成功失败都把开关头和日志打出来，方便定位问题
      - name: Report emulator core status
        if: always()
        run: |
          echo "---- build/cores/iphoneos ----"
          ls -la build/cores/iphoneos 2>/dev/null || echo "(没有 build/cores/iphoneos)"
          echo "---- GSBuiltCores.h ----"
          cat build/cores/iphoneos/GSBuiltCores.h 2>/dev/null || echo "(没有 GSBuiltCores.h)"
          echo "---- cmake configure log (tail) ----"
          tail -n 40 build/cores/iphoneos/cmake-configure.log 2>/dev/null || true
          echo "---- cmake build log (tail) ----"
          tail -n 60 build/cores/iphoneos/cmake-build.log 2>/dev/null || true

      - name: Ad-hoc sign app
        run: |
          set -euo pipefail
          APP="build/DerivedData-Device/Build/Products/Release-iphoneos/Gameshell.app"
          # ad-hoc 自签名（- 表示 ad-hoc），不需要证书
          codesign --force --deep --sign - \
            --entitlements Signing/Gameshell-iOS.entitlements \
            "$APP"
          codesign --verify --verbose=2 "$APP"
          codesign -d --entitlements :- "$APP"

      - name: Package IPA + tipa
        run: |
          set -euo pipefail
          APP="build/DerivedData-Device/Build/Products/Release-iphoneos/Gameshell.app"
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          ( cd build && zip -qry Gameshell.ipa Payload )
          # tipa 与 ipa 内容一致，仅后缀不同，便于 TrollStore 识别
          cp build/Gameshell.ipa build/Gameshell.tipa
          ls -lh build/Gameshell.ipa build/Gameshell.tipa

      # ---------- macOS ----------
      - name: Build macOS
        run: |
          set -o pipefail
          xcodebuild \
            -project Gameshell.xcodeproj \
            -scheme Gameshell \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build/DerivedData-macOS \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      # Apple Silicon 上未签名的 .app 会被 Gatekeeper 拦下（表现为「打不开」），
      # 所以这里同样做 ad-hoc 自签名。
      - name: Ad-hoc sign macOS app
        run: |
          set -euo pipefail
          APP="build/DerivedData-macOS/Build/Products/Release/Gameshell.app"
          codesign --force --deep --sign - "$APP"
          codesign --verify --verbose=2 "$APP"

      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: Gameshell-macOS
          path: build/DerivedData-macOS/Build/Products/Release/*.app
          if-no-files-found: error

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Gameshell-IPA
          path: build/Gameshell.ipa
          if-no-files-found: error

      - name: Upload TrollStore tipa
        uses: actions/upload-artifact@v4
        with:
          name: Gameshell-TrollStore-tipa
          path: build/Gameshell.tipa
          if-no-files-found: error
