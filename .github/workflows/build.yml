name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (iOS + macOS)
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show available SDKs
        run: xcodebuild -showsdks

      # ---------- iOS / iPadOS ----------
      - name: Build iOS (Simulator)
        run: |
          set -o pipefail
          xcodebuild \
            -project Gameshell.xcodeproj \
            -scheme Gameshell \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData-iOS \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      # ---------- macOS ----------
      - name: Build macOS
        run: |
          set -o pipefail
          xcodebuild \
            -project Gameshell.xcodeproj \
            -scheme Gameshell \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build/DerivedData-macOS \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Upload iOS Simulator app
        uses: actions/upload-artifact@v4
        with:
          name: Gameshell-iOS-Simulator
          path: build/DerivedData-iOS/Build/Products/Release-iphonesimulator/*.app
          if-no-files-found: warn

      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: Gameshell-macOS
          path: build/DerivedData-macOS/Build/Products/Release/*.app
          if-no-files-found: warn
