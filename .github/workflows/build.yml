name: 编译 iOS / macOS 并打包 IPA（未签名）

# 产出「未签名 + ad-hoc 自签名」的包，供 TrollStore / 侧载工具使用：
#   · Gameshell.ipa         —— 最小 entitlements，通用侧载 / TrollStore 都能装
#   · Gameshell.tipa        —— 在最小集之上带 JIT entitlements（由 TrollStore 安装时保留）
#   · Gameshell-macOS.app   —— macOS 版（ad-hoc 自签名）
# 正规签名的 IPA 需要 Apple 开发者证书与描述文件，属未完成项（见 REFERENCE.md）。

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: 编译 iOS + macOS + 打包 IPA / tipa
    runs-on: macos-15
    # 核心在 Xcode 预构建阶段交叉编译：Azahar（3DS）要现克隆上游 + 编 ~20 个子模块，
    # 是最重的一步，所以时间上限抬到 180 分钟。
    timeout-minutes: 180

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 打印工具链版本（Xcode / Swift / CMake）
        run: |
          xcodebuild -version
          swift --version
          cmake --version || true

      - name: 安装 XcodeGen 与 CMake
        run: brew install xcodegen cmake python

      - name: 用 XcodeGen 生成 Gameshell.xcodeproj
        run: xcodegen generate

      - name: 列出可用 SDK
        run: xcodebuild -showsdks

      # ---------- iOS 真机（打包 IPA / tipa） ----------
      - name: 编译 iOS 真机（未签名）
        run: |
          set -o pipefail
          xcodebuild \
            -project Gameshell.xcodeproj \
            -scheme Gameshell \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData-Device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      # 核心是交叉编译出来的：不管成功失败都把开关头与日志打出来，便于定位问题
      - name: 打印模拟器核心编译状态（成功失败都打）
        if: always()
        run: |
          echo "---- build/cores/iphoneos ----"
          ls -la build/cores/iphoneos 2>/dev/null || echo "(没有 build/cores/iphoneos)"
          echo "---- GSBuiltCores.h ----"
          cat build/cores/iphoneos/GSBuiltCores.h 2>/dev/null || echo "(没有 GSBuiltCores.h)"
          # 每个核心一份日志：<核心名>-configure.log / <核心名>-build.log
          # Azahar 的日志最大（含克隆 + 20 多个子模块编译），多打一些便于定位
          for log in build/cores/iphoneos/*-configure.log build/cores/iphoneos/*-build.log; do
            [ -f "$log" ] || continue
            echo "---- $log (tail) ----"
            tail -n 120 "$log" || true
          done

      - name: ad-hoc 自签名 iOS App（最小 entitlements）
        run: |
          set -euo pipefail
          APP="build/DerivedData-Device/Build/Products/Release-iphoneos/Gameshell.app"
          # ad-hoc 自签名（- 表示 ad-hoc），不需要证书
          codesign --force --deep --sign - \
            --entitlements Signing/Gameshell-iOS.entitlements \
            "$APP"
          codesign --verify --verbose=2 "$APP"
          echo "---- 生效的 entitlements ----"
          codesign -d --entitlements :- "$APP"

      - name: 打包 IPA（最小 entitlements）
        run: |
          set -euo pipefail
          APP="build/DerivedData-Device/Build/Products/Release-iphoneos/Gameshell.app"
          rm -rf build/payload-ipa
          mkdir -p build/payload-ipa/Payload
          cp -R "$APP" build/payload-ipa/Payload/
          ( cd build/payload-ipa && zip -qry ../Gameshell.ipa Payload )
          ls -lh build/Gameshell.ipa

      # 单独一份：复制未签 App → 用 JIT entitlements 重签 → 打包成 tipa。
      # TrollStore 安装时会保留二进制自带的 entitlements，装好后即带 JIT。
      - name: 用 JIT entitlements 重签并打包 TrollStore tipa
        run: |
          set -euo pipefail
          APP="build/DerivedData-Device/Build/Products/Release-iphoneos/Gameshell.app"
          rm -rf build/payload-tipa
          mkdir -p build/payload-tipa/Payload
          cp -R "$APP" build/payload-tipa/Payload/
          codesign --force --deep --sign - \
            --entitlements Signing/Gameshell-iOS-JIT.entitlements \
            build/payload-tipa/Payload/Gameshell.app
          codesign --verify --verbose=2 build/payload-tipa/Payload/Gameshell.app
          echo "---- tipa 生效的 entitlements ----"
          codesign -d --entitlements :- build/payload-tipa/Payload/Gameshell.app
          ( cd build/payload-tipa && zip -qry ../Gameshell.tipa Payload )
          ls -lh build/Gameshell.tipa

      # ---------- macOS ----------
      - name: 编译 macOS（未签名）
        run: |
          set -o pipefail
          xcodebuild \
            -project Gameshell.xcodeproj \
            -scheme Gameshell \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build/DerivedData-macOS \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      # Apple Silicon 上未签名的 .app 会被 Gatekeeper 拦下（表现为「打不开」），
      # 所以这里同样做 ad-hoc 自签名。
      - name: ad-hoc 自签名 macOS App
        run: |
          set -euo pipefail
          APP="build/DerivedData-macOS/Build/Products/Release/Gameshell.app"
          codesign --force --deep --sign - "$APP"
          codesign --verify --verbose=2 "$APP"

      - name: 上传 macOS .app
        uses: actions/upload-artifact@v4
        with:
          name: Gameshell-macOS
          path: build/DerivedData-macOS/Build/Products/Release/*.app
          if-no-files-found: error
          retention-days: 30

      - name: 上传 IPA（最小 entitlements）
        uses: actions/upload-artifact@v4
        with:
          name: Gameshell-IPA
          path: build/Gameshell.ipa
          if-no-files-found: error
          retention-days: 30

      - name: 上传 TrollStore tipa（带 JIT entitlements）
        uses: actions/upload-artifact@v4
        with:
          name: Gameshell-TrollStore-tipa
          path: build/Gameshell.tipa
          if-no-files-found: error
          retention-days: 30

  # ============================================================================
  # 测试用 homebrew ROM（与主构建并行，不拖慢打包）
  # 为什么单独一个 job：NDS / 3DS / GameCube 的测试程序要用 devkitPro 工具链，
  # 和 iOS 打包毫无关系；放同一个 job 里会让 IPA 多等几分钟。
  # 产物全部来自 devkitPro 官方 examples，开源可自行编译，不含任何商业 ROM。
  # ============================================================================
  testroms:
    name: 编译测试 ROM
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 devkitPro 工具链
        run: |
          set -euo pipefail
          wget -q https://apt.devkitpro.org/install-devkitpro-pacman
          sudo bash ./install-devkitpro-pacman
          sudo dkp-pacman -S --noconfirm --needed nds-dev 3ds-dev gamecube-dev

      - name: 编译 NDS 测试程序
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/devkitPro/nds-examples.git
          make -C nds-examples/hello_world -j"$(nproc)"

      - name: 编译 3DS 测试程序
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/devkitPro/3ds-examples.git
          make -C 3ds-examples/templates/application -j"$(nproc)"

      - name: 编译 GameCube 测试程序
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/devkitPro/gamecube-examples.git
          make -C gamecube-examples/templates/application -j"$(nproc)"

      - name: 汇总测试 ROM
        run: |
          set -euo pipefail
          mkdir -p test-roms
          cp nds-examples/hello_world/hello_world.nds test-roms/Test-NDS-hello.nds
          cp 3ds-examples/templates/application/application.3dsx test-roms/Test-3DS-hello.3dsx
          cp gamecube-examples/templates/application/application.dol test-roms/Test-GC-hello.dol
          ls -lh test-roms

      - name: 上传测试 ROM
        uses: actions/upload-artifact@v4
        with:
          name: test-roms
          path: test-roms/
          if-no-files-found: error
          retention-days: 30
