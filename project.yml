name: Gameshell
options:
  bundleIdPrefix: com.twoyears666
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "16.0"
    macOS: "14.0"
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

targets:
  Gameshell:
    type: application
    supportedDestinations: [iOS, macOS]
    deploymentTarget:
      iOS: "16.0"
      macOS: "14.0"
    sources:
      - path: Sources
      - path: Resources
    info:
      path: Sources/Resources/Info.plist
      properties:
        CFBundleDisplayName: Gameshell
        CFBundleName: Gameshell
        CFBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        CFBundleExecutable: "$(EXECUTABLE_NAME)"
        CFBundlePackageType: APPL
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleDevelopmentRegion: "$(DEVELOPMENT_LANGUAGE)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.games
        NSHumanReadableCopyright: "Gameshell — UI shell. 参考盖世游戏/GameHub 的界面设计。"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        # ---- URL 驱动：gameshell://open?url=... ----
        CFBundleURLTypes:
          - CFBundleURLName: com.twoyears666.gameshell
            CFBundleURLSchemes:
              - gameshell
        # ---- 允许加载任意 http(s) 游戏页面（自签/自建服务端） ----
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        # ---- iOS 相关 ----
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: false
        GCSupportsControllerUserInteraction: true
        # ---- macOS 相关 ----
        NSHighResolutionCapable: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.twoyears666.gameshell
        PRODUCT_NAME: Gameshell
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Core/Gameshell-Bridging-Header.h
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleDisplayName: Gameshell
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CLANG_ENABLE_MODULES: YES
        GCC_C_LANGUAGE_STANDARD: gnu11
        CLANG_CXX_LANGUAGE_STANDARD: gnu++17
        ENABLE_HARDENED_RUNTIME: NO

schemes:
  Gameshell:
    build:
      targets:
        Gameshell: all
    run:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release
