name: Gameshell
options:
  bundleIdPrefix: com.twoyears666
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "16.0"
    macOS: "14.0"
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    # 必须关掉脚本沙箱：预构建脚本要调 cmake / xcrun 交叉编译 mGBA，
    # 并往 $(SRCROOT)/build/cores 写产物，沙箱会把这些操作全部拦下来。
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

targets:
  Gameshell:
    type: application
    supportedDestinations: [iOS, macOS]
    deploymentTarget:
      iOS: "16.0"
      macOS: "14.0"
    sources:
      - path: Sources
      - path: Resources
    preBuildScripts:
      # 交叉编译 mGBA 静态库（GBA/GB/GBC）并生成 GSBuiltCores.h 编译期开关。
      # 编译失败不会让构建失败：脚本会写 GS_HAVE_MGBA 0 + 空壳库。
      # macOS 平台按设计直接跳过（保持纯 URL 模式）。
      - name: Build emulator cores
        basedOnDependencyAnalysis: false
        script: |
          set -e
          "$SRCROOT/Scripts/build_cores.sh"
    info:
      path: Sources/Resources/Info.plist
      properties:
        CFBundleDisplayName: Gameshell
        CFBundleName: Gameshell
        CFBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        CFBundleExecutable: "$(EXECUTABLE_NAME)"
        CFBundlePackageType: APPL
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleDevelopmentRegion: "$(DEVELOPMENT_LANGUAGE)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.games
        NSHumanReadableCopyright: "Gameshell — UI shell. 参考盖世游戏/GameHub 的界面设计。"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        # ---- URL 驱动：gameshell://open?url=... ----
        CFBundleURLTypes:
          - CFBundleURLName: com.twoyears666.gameshell
            CFBundleURLSchemes:
              - gameshell
        # ---- 允许加载任意 http(s) 游戏页面（自签/自建服务端） ----
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        # ---- iOS 相关 ----
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: false
        GCSupportsControllerUserInteraction: true
        # ---- ROM 导入：让「文件」App 能直接看到自己的 Documents/ROMs ----
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # ---- 探测 TrollStore：用来给本 App 打开 JIT 权限 ----
        LSApplicationQueriesSchemes:
          - apple-magnifier
        # ---- macOS 相关 ----
        NSHighResolutionCapable: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.twoyears666.gameshell
        PRODUCT_NAME: Gameshell
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Core/Gameshell-Bridging-Header.h
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleDisplayName: Gameshell
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CLANG_ENABLE_MODULES: YES
        GCC_C_LANGUAGE_STANDARD: gnu11
        CLANG_CXX_LANGUAGE_STANDARD: gnu++17
        ENABLE_HARDENED_RUNTIME: NO
        # 预构建脚本产出的编译期开关头（GSBuiltCores.h）与各核心的公开头都从这里找
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/build/cores/$(PLATFORM_NAME)
          - $(SRCROOT)/Vendor/mgba/include
          # Nestopia 的核心头与 C++ API 头（GSNestopiaCore.mm 直接 include）
          - $(SRCROOT)/Vendor/nestopia/source/core
          - $(SRCROOT)/Vendor/nestopia/source/core/api
          # Mesen-S 的 libretro 契约头（GSSnesCore.mm include 了 libretro.h）
          - $(SRCROOT)/Vendor/mesens/Libretro
          # melonDS 的 libretro 契约头（GSMelonDSCore.mm 刻意写
          # libretro-common/include/libretro.h，避免命中上面 Mesen-S 那份）
          # 以及两处共用的入口点符号前缀头 gs_symbol_prefix.h
          - $(SRCROOT)/Vendor/melonds/src/libretro
        # 静态库按平台放在 build/cores/<PLATFORM>，macOS 上是空壳库（保证 -lmgba 找得到）
        LIBRARY_SEARCH_PATHS:
          - $(SRCROOT)/build/cores/$(PLATFORM_NAME)
        OTHER_LDFLAGS:
          - -lmgba
          - -lnestopia
          - -lmesens
          - -lmelonds

schemes:
  Gameshell:
    build:
      targets:
        Gameshell: all
    run:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release
